name: Setup repo
description: Install Node from .nvmrc and install dependencies. The calling workflow must run actions/checkout first, because local actions only exist on disk after checkout.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
    - run: npm ci
      shell: bash
